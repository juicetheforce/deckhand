notes = """
Public repo; releases install with a one-line curl script (prebuilt, brings its own Node).
Daemon and editor are separate programs: the editor only writes config.
v0.4.0 added multi-deck editing (confirmed on Nobara 2026-09-27); v0.4.1 (status line no longer moves the grid) confirmed there 2026-09-30.
v0.5.0 (2026-10-01): OBS keys, desktop notifications and Clear for failed keys; confirmed on the laptop against real OBS.
v0.5.1 (2026-10-02): Settings › About shows the installed version and links the releases page; no update checking, by decision.
Streaming in scope since 2026-10-01: OBS built in (a client of obs-websocket, not a plugin), then Twitch as actions only; virtual decks recorded for later.
OBS is "set up" when a connection is saved (not when it has a password or has connected once); its pickers come only from OBS, never typed.
v0.6.0 (2026-10-03): VTube Studio keys (Trigger hotkey, Toggle expression, Model), built around the model in use; and a fix for page tabs clicked quickly losing a click. Confirmed on the laptop; VTube Studio milestone closed.
Twitch (2026-10-14): one public client ID for every user (no secret), owned by a dedicated account; an hourly validate-and-refresh timer while linked is an accepted exception to "no timers at rest", because Twitch requires it.
Twitch sessions 1 and 2 confirmed live on real Twitch (2026-10-14): Marker, Clip, Chat message, Stream info, Settings.
v0.7.0 (2026-10-14): Twitch and a reworked settings window (sidebar of pages, status dots); published before the day-later link check, at Ryan's word.
v0.7.1 (2026-10-15): code audit 2's fixes (credentials write race, icon reads, Studio/Neo/Pedal, event-driven faces: a page of integration keys 0.85% -> 0.09% of a core); every failed press notifies, counted; Update available in About (reverses "no update check"). The Twitch link confirmed alive after 25 h.
Virtual decks planned (2026-10-15): a touchscreen as a deck, layouts keyed by the screen; six stages from a probe to custom panels; the plan (not yet decided) reads the touchscreen directly, grabbed, so no focus stealing and no KDE mapping. Twitch app renamed "Deckhand App".
Virtual decks stage 1 (2026-10-16): S1 (the device seam) and S2 (the display helper) confirmed on the laptop; S3 built: touch read directly and grabbed, screens keyed by EDID, pairing by one tap, no touch while the session is locked or inactive (failing closed). The udev rule grants touchscreens only; the clock key stays as it is.
S3 confirmed on the 10.3" panel (2026-10-16). S4 built: Settings › Decks adds a virtual deck (screen, tap, size); the editor names keys by control id; a resize keeps keys by row and column, keeping a copy first since the editor has no undo.
S4 confirmed (2026-10-17): a deck in a profile without keys gets a blank page; resize drops keys after a warning, no kept copy. S5: v0.8.0 built as a release candidate, tagged locally only, not published until both machines are confirmed; the panel helper now survives KWin removing its output on a screen wake (found measuring idle: 0.29% of a core, the panel helper 0). Stage 2 will have adjustable background transparency.
v0.8.0 published 2026-10-17: virtual decks (a touchscreen as a deck). A touchscreen is readable only once paired: pairing asks for the password and writes a per-user file ACL rule for that touchscreen alone (never the sticky uaccess tag); Remove takes it away. Checked on the laptop and on Nobara with the Xeneon (2026-10-17).
v0.8.1 published 2026-10-17: a virtual deck has a default size, so a profile made later never gives it zero keys (found on both machines). A 2.5 GB memory peak during a display-flapping run was investigated and is not being pursued; a smaller per-redraw native leak is logged to fix later.
Virtual decks stage 1 complete and confirmed on both machines (2026-10-17): v0.8.1 checked on Nobara with the Xeneon Edge and already used in a game.
Discord stage 0 (2026-10-20): each user brings their own app's client ID (Public Client + PKCE, no secret, no shared app; Discord isn't approving RPC apps). RPM and Flatpak supported, Vesktop not. Every voice action but per-user volume confirmed against the laptop's Flatpak Discord. REFERENCE gained Home Assistant and webhooks (command keys, no integration).
Discord built (2026-10-22): Mute, Deafen, Input mode, Join, Leave, User volume; connected while the profile has a Discord key on any page (its handshake can take 20 s), keys show a connecting badge meanwhile and a press never waits; Remove and the uninstaller revoke the tokens. Offline suites pass; real-Discord checks next.
v0.9.0 published 2026-10-22: Discord. Checked on the laptop's Flatpak (one bug found and fixed: a dead socket file left by the Flatpak). Keeps all three Discord scopes (rpc is required and broad); Nobara's RPM checks come after the release.
Discord checked on Nobara's RPM too (2026-10-22): everything as on the Flatpak, the join event sent, no slow handshake. Discord work closed.
v0.10.0 polish built (2026-10-22), not released: soundboard (pw-play, else paplay; Elgato's five press modes), line breaks in labels, built-in icons drawn at 53% of the key (tunable in config), virtual deck on/off as a key (session-only), profile delete beside the rename field, OBS custom icons per state. The output-loss "leak" was not reproduced; per-draw pixel copies removed. Dim and sleep designed only, awaiting Ryan's decisions.
Round 1 confirmed by Ryan on the laptop (2026-10-23). Round 2: built-in icon size is a Settings slider (Claude Design 16; 30-70%, default 45%; the pattern for every future slider); a virtual deck turned off stays off across restarts (state dir); own state icons on every two-state key. Dim and sleep is not in v0.10.0.
Round 3: icon size shown relative to its maximum (40-100%, default 65%); every key with states has two icons, a Default icon and one for its active state (iconActive), the pattern for every multi-state key; old configs migrated (daemon in memory, editor on open).
v0.10.0 published 2026-10-24: the polish release, plus the editor's grid following each key's state live (it showed only the default state; found on Discord Input mode). Ship test 75/75.
Dim and sleep decided (2026-10-24): sleep on lock first, idle dimming a later round; brightness 0 vs black keys settled by a dark-room test; first press after sleep only wakes; global settings only. New Sleep all decks action. Next round: sleep on lock, Sleep all decks, Brightness target picker with screen brightness for virtual decks through Plasma.
Round 5 (the grid follows each key's state) confirmed on v0.10.0 (2026-10-24). Sleep all decks: a press on a dimmed deck runs its key; a press on any deck wakes them all.
"""
